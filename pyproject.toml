[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-stemprep"
version = "0.1.0"
description = "Prepare Ableton Live sets for stem export: flatten groups while keeping gain and group effects, keep vocals raw, set the export range."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ableton", "ableton-live", "stems", "stem-export", "als", "mixing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
ableton-stemprep = "ableton_stemprep:main"

[tool.setuptools]
py-modules = ["ableton_stemprep"]
